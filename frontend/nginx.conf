worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  # "api" is the docker-compose service name for the FastAPI backend.
  # Overridable via API_UPSTREAM if you rename the service.
  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors frontend/vite.config.ts's dev proxy 1:1 so the same relative
    # API_BASE/WS_BASE defaults ("/api/sim", "" ) work unchanged in prod.
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
    }

    location /ready {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
    }

    location /ws/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;   # long-lived simulation WebSocket
      proxy_send_timeout 3600s;
    }

    # SPA fallback: any non-API, non-asset path serves index.html so
    # client-side routing works on a hard refresh / deep link.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; never cache index.html itself.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|glb|gltf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }
  }
}
